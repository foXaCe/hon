name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pip-audit
        run: python3 -m pip install --quiet pip-audit

      - name: Audit manifest.json (HA integration requirements)
        run: |
          for m in $(find custom_components -name manifest.json); do
            jq -r '.requirements[]' "$m" > /tmp/m_reqs.txt 2>/dev/null || true
            [ -s /tmp/m_reqs.txt ] && pip-audit --requirement /tmp/m_reqs.txt --strict || true
          done

      - name: Audit requirements_dev / test
        run: |
          # PYSEC-2026-4140..4152 + CVE-2026-102275 : PyJWT 2.13.0, epingle par homeassistant
          # (PyJWT==2.13.0 dans toutes les versions publiees, 2026.9.4 incluse)
          # et accessible ici via pytest-homeassistant-custom-component. Le fixe
          # est PyJWT 2.15.0, impossible tant que HA epingle 2.13.0. Dependance
          # de test uniquement, hors perimetre runtime de l'integration
          # (manifest.json requirements: []). A lever quand HA publie une
          # version sans cet epinglage.
          for r in requirements_dev.txt requirements_test.txt requirements.txt; do
            if [ -f "$r" ]; then
              pip-audit --requirement "$r" --strict \
                --ignore-vuln PYSEC-2026-3552 \
                --ignore-vuln PYSEC-2026-3553 \
                --ignore-vuln PYSEC-2026-3554 \
                --ignore-vuln PYSEC-2026-4140 \
                --ignore-vuln PYSEC-2026-4141 \
                --ignore-vuln PYSEC-2026-4142 \
                --ignore-vuln PYSEC-2026-4143 \
                --ignore-vuln PYSEC-2026-4144 \
                --ignore-vuln PYSEC-2026-4145 \
                --ignore-vuln PYSEC-2026-4146 \
                --ignore-vuln PYSEC-2026-4147 \
                --ignore-vuln PYSEC-2026-4148 \
                --ignore-vuln PYSEC-2026-4149 \
                --ignore-vuln PYSEC-2026-4150 \
                --ignore-vuln PYSEC-2026-4151 \
                --ignore-vuln PYSEC-2026-4152 \
                --ignore-vuln CVE-2026-102275
            fi
          done

  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |
            --recursive
            --no-resolve
            --config=osv-scanner.toml
            ./

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lockfile-freshness:
    name: Lockfile age check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Check lockfile age
        run: |
          for lock in package-lock.json yarn.lock pnpm-lock.yaml poetry.lock Pipfile.lock Cargo.lock; do
            [ -f "$lock" ] || continue
            AGE=$(( ($(date +%s) - $(git log -1 --format=%ct -- "$lock")) / 86400 ))
            if [ $AGE -gt 90 ]; then
              echo "::error file=$lock::$lock non régénéré depuis $AGE jours → CVE probables, lancer le manager (npm install / poetry update / etc.)"
              exit 1
            elif [ $AGE -gt 60 ]; then
              echo "::warning file=$lock::$lock vieillit ($AGE jours)"
            fi
          done

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
